<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123A63" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070D16" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Netra - one searchable network across 26 departments' CCTV. Trace a vehicle across every camera it passed, and get alerted the moment a watchlisted vehicle is seen."
    />
    <title>Netra - the eyes of the police</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />

    <script>
      // Resolve the theme before first paint so a dark-mode operator never
      // gets flashed a full-white screen on load.
      (function () {
        try {
          var saved = localStorage.getItem("netra-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* private mode / storage blocked - the light default already applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
