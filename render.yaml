services:
  - type: web
    name: netra-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CCTV_HOST
        sync: false
      - key: CCTV_DIRECT_IP
        sync: false
      - key: CCTV_EMAIL
        sync: false
      - key: CCTV_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_EMAIL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_TOKEN
        sync: false

  - type: web
    name: netra-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
